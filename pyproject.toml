[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipbro"
version = "0.1.0"
description = "Local, content-agnostic 9:16 clipper: motion data layer."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["clipbro*"]
